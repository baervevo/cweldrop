[package]
name = "cweldrop"
version = "0.1.0"
edition = "2021"
description = "AirDrop-inspired terminal chat over LAN (mDNS + TCP)"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
hostname = "0.4"
futures-util = "0.3"
whoami = "1"
if-addrs = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
notify-rust = "4"
unicode-width = "0.2"
ratatui-image = { version = "8.1.1", default-features = false, features = ["crossterm"] }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "qoi", "pnm"] }
ansi-to-tui = "7"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }

[profile.release]
lto = "thin"
strip = true
