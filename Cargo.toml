[package]
name = "cweldrop"
version = "0.1.0"
edition = "2021"
description = "AirDrop-inspired terminal chat over LAN (mDNS + TCP)"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
hostname = "0.4"
futures-util = "0.3"
whoami = "1"
if-addrs = "0.13"

[profile.release]
lto = "thin"
strip = true
